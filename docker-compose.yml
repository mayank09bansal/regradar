# docker compose up --build            -> backend :8000, dashboard :5173
# docker compose --profile integrations up --build   -> also n8n :5678
services:
  backend:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:////app/data/runtime/regradar.db
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    volumes:
      - regradar-data:/app/data/runtime
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    profiles: ["integrations"]
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: Asia/Kolkata
      REGRADAR_API_TOKEN: ${REGRADAR_API_TOKEN:-}
    volumes:
      - n8n-data:/home/node/.n8n
    restart: unless-stopped

volumes:
  regradar-data:
  n8n-data:
